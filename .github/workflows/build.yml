name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SteamRT3
            runtime: steamrt3
          - name: SteamRT4
            runtime: steamrt4
    container:
      image: ghcr.io/femboykz/build-containers:${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git init -q hl2sdk-cs2
          git -C hl2sdk-cs2 fetch -q --depth 1 "$(git config -f .gitmodules submodule.hl2sdk-cs2.url)" "$(git rev-parse HEAD:hl2sdk-cs2)"
          git -C hl2sdk-cs2 checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
          git -C metamod-source submodule update --init --depth 1 hl2sdk-manifests third_party/khook

      - name: Configure
        run: |
          mkdir -p build && cd build
          python3 ../configure.py \
            --enable-optimize \
            --symbol-files

      - name: Build
        working-directory: build
        run: ambuild

      - name: Stage package
        run: |
          mkdir -p staging/addons
          cp -r build/package/addons/* staging/addons/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: autorestart-${{ matrix.runtime }}
          path: staging

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: autorestart-${{ matrix.runtime }}-symbols
          path: build/autorestart.cs2/linux-x86_64/*.dbg

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download SteamRT3 artifact
        uses: actions/download-artifact@v8
        with:
          name: autorestart-steamrt3
          path: autorestart-steamrt3

      - name: Download SteamRT4 artifact
        uses: actions/download-artifact@v8
        with:
          name: autorestart-steamrt4
          path: autorestart-steamrt4

      - name: Download symbol artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: autorestart-*-symbols
          path: symbols

      - name: Create archives
        run: |
          cd autorestart-steamrt3 && zip -r ../autorestart-${{ github.ref_name }}-steamrt3.zip . && cd ..
          cd autorestart-steamrt4 && zip -r ../autorestart-${{ github.ref_name }}-steamrt4.zip . && cd ..
          cd symbols && zip -r ../autorestart-${{ github.ref_name }}-symbols.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            autorestart-${{ github.ref_name }}-steamrt3.zip
            autorestart-${{ github.ref_name }}-steamrt4.zip
            autorestart-${{ github.ref_name }}-symbols.zip
          generate_release_notes: true
