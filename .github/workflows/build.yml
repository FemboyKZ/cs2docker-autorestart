name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          apt-get update -y
          apt-get install -y python3 python3-pip
          git clone https://github.com/alliedmodders/ambuild.git
          pip3 install ./ambuild

      - name: Configure
        run: |
          mkdir -p build && cd build
          python3 ../configure.py \
            --sdks cs2 \
            --targets x86_64 \
            --mms_path ../metamod-source \
            --hl2sdk-manifests ../metamod-source/hl2sdk-manifests \
            --enable-optimize

      - name: Build
        working-directory: build
        run: ambuild

      - name: Stage package
        run: |
          mkdir -p staging/addons
          cp -r build/package/addons/* staging/addons/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: autorestart-linux
          path: staging

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: autorestart-linux
          path: autorestart-linux

      - name: Create archives
        run: |
          cd autorestart-linux && zip -r ../autorestart-${{ github.ref_name }}-linux.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            autorestart-${{ github.ref_name }}-linux.zip
          generate_release_notes: true
